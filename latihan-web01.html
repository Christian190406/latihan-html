<!DOCTYPE html>
<html>
<head>
<style>
* {
    box-sizing: border-box;
}

table {
  width: 50%;
  border-collapse: collapse;
  font-family:Arial, sans-serif;
  font-size: 12px;
}

th, td {
  border: 1px solid;
}

th {
  font-weight: normal;
  text-align: center;
  padding: 12px;
}

.konten {
    background-color: #f7cccc;
    border-color: #e77b7b;
    width: 75%;
    height: 220px;
    padding: 40px;
    vertical-align: middle;
}

.menu {
    background-color: #d6e8d2;
    border-color: #91bd8b;
    width: 25%;
    padding: 2px;
    vertical-align: middle;
}

.header, .footer {
    background-color: #ffead3;
    border-color: #ffb347;
}

.navigasi {
    background-color: #d8e6fc;
    border-color: #8db4f5;
}

h1 {
    font-size: 24px;
}

h2 {
    font-size: 12px;
}
</style>
</head>
<body>

<table>
  <tr>
    <th colspan= "2" class="header" >HEADER</th>
  </tr>

  <tr>
    <th colspan="2" class="navigasi">NAVIGASI</th>
  </tr>
  
  <tr>
    <td class="konten">
    <h1>Heading 1</h1>
    <p>
    Lorem ipsum dolor sit amet, consectetur
    adipiscing elit, sed do eiusmod tempor
    incididuntut labore et dolore magna aliqua.
</p>
</td>
    
    <td class="menu">
        <h2>Menu:</h2>
        <ul>
            <li>Home</li>
            <li>Berita</li>
            <li>Layanan</li>
            <li>Kontak</li>
        </ul>  
    </td>
  </tr>

  <tr>
    <th colspan="2" class="footer">FOOTER</th>
  </tr>
</table>

</body>
</html>
